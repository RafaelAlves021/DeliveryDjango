<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} | Gerenciador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-zinc-100 text-zinc-900 min-h-screen pb-20 antialiased">

    <header class="bg-zinc-950 text-white border-b border-zinc-800">
        <div class="max-w-2xl mx-auto px-5 py-4 flex items-center justify-between">
            <h1 class="text-base font-bold tracking-tight">{{ titulo }}</h1>
            <a href="{% url 'cardapio' %}" class="text-xs font-semibold bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3.5 py-2 rounded-xl transition">
                ← Voltar
            </a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 mt-6">
        <div class="bg-white rounded-3xl border border-zinc-200/80 shadow-sm p-6 md:p-8">
            <form method="post" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-xs font-bold uppercase text-zinc-600 mb-1">Categoria</label>
                    {{ form.categoria }}
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-zinc-600 mb-1">Nome do Produto</label>
                    {{ form.nome }}
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-zinc-600 mb-1">Descrição</label>
                    {{ form.descricao }}
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-zinc-600 mb-1">Preço (R$)</label>
                    {{ form.preco }}
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-zinc-600 mb-1">Foto do Produto</label>
                    {{ form.imagem }}
                </div>

                <div class="flex items-center gap-2 pt-2">
                    {{ form.disponivel }}
                    <label class="text-sm font-semibold text-zinc-700">Produto disponível para venda</label>
                </div>

                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 px-4 rounded-2xl shadow transition text-sm md:text-base mt-4">
                    Salvar Produto
                </button>
            </form>
        </div>
    </main>

</body>
</html>
