<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Entrega | Burguer & Co.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-zinc-100 text-zinc-900 min-h-screen pb-20 antialiased">

    <!-- Topo -->
    <header class="bg-zinc-950 text-white border-b border-zinc-800">
        <div class="max-w-2xl mx-auto px-5 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-2xl">📍</span>
                <h1 class="text-lg font-bold tracking-tight">Onde Entregar?</h1>
            </div>
            <a href="{% url 'ver_carrinho' %}" class="text-xs font-semibold bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3.5 py-2 rounded-xl transition">
                ← Voltar ao carrinho
            </a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 mt-6">
        <div class="bg-white rounded-3xl border border-zinc-200/80 shadow-sm p-6 md:p-8">
            <form method="post" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-xs font-extrabold uppercase tracking-wider text-zinc-600 mb-1.5">Seu Nome Completo</label>
                    {{ form.cliente_nome }}
                </div>

                <div>
                    <label class="block text-xs font-extrabold uppercase tracking-wider text-zinc-600 mb-1.5">WhatsApp para Contato</label>
                    {{ form.cliente_telefone }}
                </div>

                <div>
                    <label class="block text-xs font-extrabold uppercase tracking-wider text-zinc-600 mb-1.5">Endereço de Entrega</label>
                    {{ form.endereco_entrega }}
                </div>

                <div>
                    <label class="block text-xs font-extrabold uppercase tracking-wider text-zinc-600 mb-1.5">Ponto de Referência (opcional)</label>
                    {{ form.ponto_referencia }}
                </div>

                <div>
                    <label class="block text-xs font-extrabold uppercase tracking-wider text-zinc-600 mb-1.5">Observações da Cozinha</label>
                    {{ form.observacoes }}
                </div>

                <div class="pt-5 border-t border-zinc-100 flex items-center justify-between">
                    <div>
                        <span class="block text-xs font-semibold text-zinc-500">Valor a pagar na entrega:</span>
                        <span class="text-2xl font-black text-zinc-950">R$ {{ carrinho.get_total_preco }}</span>
                    </div>
                </div>

                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 text-white font-bold py-4 px-4 rounded-2xl shadow-xl shadow-red-600/30 transition text-sm md:text-base tracking-wide">
                    Confirmar e Enviar Pedido
                </button>
            </form>
        </div>
    </main>

</body>
</html>
