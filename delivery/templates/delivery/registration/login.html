<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Área Administrativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-zinc-100 text-zinc-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl border border-zinc-200/80 shadow-xl p-8 max-w-sm w-full">
        <div class="text-center mb-6">
            <span class="text-4xl block mb-2">🔐</span>
            <h1 class="text-xl font-extrabold text-zinc-900">Acesso Restrito</h1>
            <p class="text-xs text-zinc-500 mt-1">Identifique-se para gerenciar o cardápio</p>
        </div>

        {% if form.errors %}
            <div class="bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl p-3 mb-4">
                Usuário ou senha incorretos. Tente novamente.
            </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-bold uppercase text-zinc-600 mb-1">Usuário</label>
                <input type="text" name="username" autofocus required class="w-full px-4 py-2.5 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-red-500 focus:outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-zinc-600 mb-1">Senha</label>
                <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-red-500 focus:outline-none text-sm">
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-red-600/20 transition text-sm">
                Entrar no Sistema
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="{% url 'cardapio' %}" class="text-xs text-zinc-500 hover:text-zinc-800 transition">
                ← Voltar para o cardápio
            </a>
        </div>
    </div>

</body>
</html>
