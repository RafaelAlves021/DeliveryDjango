{% extends 'delivery/base.html' %}

{% block title %}Excluir Produto{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px;">
    <div class="card shadow-sm border-0 text-center p-4">
        <div class="display-4 text-danger mb-2">⚠️</div>
        <h4 class="fw-bold">Confirmar Exclusão</h4>
        <p class="text-muted">Tem a certeza de que deseja excluir o produto <strong>{{ produto.nome }}</strong>? Esta ação não pode ser desfeita.</p>

        <form method="post" class="mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Sim, Excluir</button>
            <a href="{% url 'produto_detalhe' produto.id %}" class="btn btn-light w-100 py-2 mt-2">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
